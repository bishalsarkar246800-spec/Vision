<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180">
  <defs>
    <filter id="pixel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Pixel Grid Art: Eye of Vision + Branching Commit Key -->
  <!-- 10x10 pixel grid representation with crisp borders -->

  <!-- Outer Shadow / Border Backdrop -->
  <g filter="url(#pixel-glow)">
    <!-- Branching Commit Crystal Pixel Art (Left) -->
    <rect x="20" y="70" width="16" height="16" fill="#FBBF24" stroke="#000" stroke-width="2"/>
    <rect x="36" y="70" width="16" height="16" fill="#F59E0B" stroke="#000" stroke-width="2"/>
    <rect x="52" y="70" width="16" height="16" fill="#D97706" stroke="#000" stroke-width="2"/>
    <rect x="52" y="54" width="16" height="16" fill="#FBBF24" stroke="#000" stroke-width="2"/>
    <rect x="52" y="86" width="16" height="16" fill="#FBBF24" stroke="#000" stroke-width="2"/>
    <rect x="68" y="70" width="16" height="16" fill="#F59E0B" stroke="#000" stroke-width="2"/>

    <!-- Eye Body Outline & Fill (Right) -->
    <!-- Top arch -->
    <rect x="136" y="24" width="32" height="16" fill="#8B5CF6" stroke="#000" stroke-width="2"/>
    <rect x="104" y="40" width="32" height="16" fill="#A78BFA" stroke="#000" stroke-width="2"/>
    <rect x="168" y="40" width="32" height="16" fill="#7C3AED" stroke="#000" stroke-width="2"/>
    
    <!-- Mid ring -->
    <rect x="88" y="56" width="16" height="32" fill="#C4B5FD" stroke="#000" stroke-width="2"/>
    <rect x="200" y="56" width="16" height="32" fill="#6D28D9" stroke="#000" stroke-width="2"/>
    <rect x="72" y="72" width="16" height="16" fill="#A78BFA" stroke="#000" stroke-width="2"/>
    <rect x="216" y="72" width="16" height="16" fill="#5B21B6" stroke="#000" stroke-width="2"/>

    <!-- Bottom arch -->
    <rect x="104" y="88" width="32" height="16" fill="#7C3AED" stroke="#000" stroke-width="2"/>
    <rect x="168" y="88" width="32" height="16" fill="#6D28D9" stroke="#000" stroke-width="2"/>
    <rect x="136" y="104" width="32" height="16" fill="#5B21B6" stroke="#000" stroke-width="2"/>

    <!-- Sclera / Inner Eye White -->
    <rect x="120" y="56" width="64" height="32" fill="#FFFFFF" stroke="#000" stroke-width="2"/>

    <!-- Iris (Emerald / Mint Green & Cyan) -->
    <rect x="136" y="56" width="32" height="32" fill="#10B981" stroke="#000" stroke-width="2"/>
    <rect x="144" y="64" width="16" height="16" fill="#047857" stroke="#000" stroke-width="2"/>
    
    <!-- Pupil (Deep Obsidian & Specular Sparkle) -->
    <rect x="148" y="68" width="8" height="8" fill="#111827"/>
    <rect x="144" y="60" width="6" height="6" fill="#FDFBF7"/>

    <!-- Floating Git Node Sparks -->
    <rect x="236" y="44" width="12" height="12" fill="#F43F5E" stroke="#000" stroke-width="1.5"/>
    <rect x="248" y="76" width="12" height="12" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
    <rect x="236" y="108" width="12" height="12" fill="#10B981" stroke="#000" stroke-width="1.5"/>

    <!-- Connecting pixel lines -->
    <rect x="228" y="48" width="8" height="4" fill="#000"/>
    <rect x="232" y="80" width="16" height="4" fill="#000"/>
    <rect x="228" y="112" width="8" height="4" fill="#000"/>
  </g>
</svg>

