<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="960" height="130">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000"/>
    </filter>
  </defs>

  <style>
    .icon-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #6B7280; text-anchor: middle; }
    .icon-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 500; fill: #9CA3AF; text-anchor: middle; }
  </style>

  <!-- 1. STACK (LIFO) -->
  <g transform="translate(60, 10)">
    <circle cx="28" cy="28" r="26" fill="#E9D5FF" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Stack icon: 3 layers -->
    <path d="M16 34 L28 40 L40 34 M16 28 L28 34 L40 28 M16 22 L28 28 L40 22 L28 16 Z" fill="none" stroke="#6B21A8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="74" class="icon-label">Custom Stack</text>
    <text x="28" y="88" class="icon-sub">LIFO Rollback</text>
  </g>

  <!-- 2. QUEUE (FIFO) -->
  <g transform="translate(170, 10)">
    <circle cx="28" cy="28" r="26" fill="#BBF7D0" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Queue icon: conveyor / FIFO blocks with arrow -->
    <rect x="15" y="21" width="8" height="14" rx="2" fill="#047857" stroke="#000" stroke-width="1.5"/>
    <rect x="25" y="21" width="8" height="14" rx="2" fill="#047857" stroke="#000" stroke-width="1.5"/>
    <rect x="35" y="21" width="8" height="14" rx="2" fill="#047857" stroke="#000" stroke-width="1.5"/>
    <path d="M11 28 L45 28 M41 24 L45 28 L41 32" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
    <text x="28" y="74" class="icon-label">Linked Queue</text>
    <text x="28" y="88" class="icon-sub">FIFO Staging WAL</text>
  </g>

  <!-- 3. HASHTABLE (DJB2) -->
  <g transform="translate(280, 10)">
    <circle cx="28" cy="28" r="26" fill="#FEF08A" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Hash table icon: hash key # and linked pointers -->
    <text x="28" y="36" font-family="monospace" font-size="26" font-weight="900" fill="#854D0E" text-anchor="middle">#</text>
    <text x="28" y="74" class="icon-label">Hash Table</text>
    <text x="28" y="88" class="icon-sub">DJB2 &amp; Chaining</text>
  </g>

  <!-- 4. CAS OBJECT STORAGE -->
  <g transform="translate(390, 10)">
    <circle cx="28" cy="28" r="26" fill="#BAE6FD" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- CAS cube icon -->
    <path d="M28 16 L42 24 L42 38 L28 46 L14 38 L14 24 Z M14 24 L28 32 L42 24 M28 32 L28 46" fill="none" stroke="#0369A1" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="28" y="74" class="icon-label">CAS Storage</text>
    <text x="28" y="88" class="icon-sub">Content-Addressed</text>
  </g>

  <!-- 5. SYNTAX PARSER -->
  <g transform="translate(500, 10)">
    <circle cx="28" cy="28" r="26" fill="#FED7AA" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Delimiter brackets icon: { } ( ) [ ] -->
    <text x="28" y="34" font-family="monospace" font-size="18" font-weight="800" fill="#9A3412" text-anchor="middle">{ [ ] }</text>
    <text x="28" y="74" class="icon-label">Syntax Validator</text>
    <text x="28" y="88" class="icon-sub">Delimiter Parser</text>
  </g>

  <!-- 6. DEDUPLICATION ENGINE -->
  <g transform="translate(610, 10)">
    <circle cx="28" cy="28" r="26" fill="#FECDD3" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Deduplication: two identical nodes pointing to one -->
    <circle cx="20" cy="20" r="5" fill="#BE123C"/>
    <circle cx="20" cy="36" r="5" fill="#BE123C"/>
    <circle cx="38" cy="28" r="7" fill="#E11D48"/>
    <path d="M25 21 L32 26 M25 35 L32 30" stroke="#BE123C" stroke-width="1.8"/>
    <text x="28" y="74" class="icon-label">Deduplication</text>
    <text x="28" y="88" class="icon-sub">Zero-Growth CAS</text>
  </g>

  <!-- 7. TRANSACTION ENGINE -->
  <g transform="translate(720, 10)">
    <circle cx="28" cy="28" r="26" fill="#DDD6FE" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Transaction circular undo/redo arrow -->
    <path d="M18 28 A10 10 0 1 1 36 34 M32 36 L36 34 L38 30" fill="none" stroke="#4C1D95" stroke-width="2.5" stroke-linecap="round"/>
    <text x="28" y="74" class="icon-label">Transaction Log</text>
    <text x="28" y="88" class="icon-sub">Atomic Rollback</text>
  </g>

  <!-- 8. NEO-BRUTALIST APP -->
  <g transform="translate(830, 10)">
    <circle cx="28" cy="28" r="26" fill="#FDE047" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <!-- Mac App window icon with 3 dots -->
    <rect x="16" y="18" width="24" height="20" rx="3" fill="#FFF" stroke="#000" stroke-width="1.8"/>
    <circle cx="21" cy="23" r="1.5" fill="#EF4444"/>
    <circle cx="26" cy="23" r="1.5" fill="#F59E0B"/>
    <circle cx="31" cy="23" r="1.5" fill="#10B981"/>
    <text x="28" y="74" class="icon-label">Vision GUI</text>
    <text x="28" y="88" class="icon-sub">Native Mac App</text>
  </g>
</svg>

